name: Docker

on:
  push:
    branches: [master, main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: cli
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: true
          tags: ghcr.io/shoham-b/backseat-driver-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: api
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: true
          tags: ghcr.io/shoham-b/backseat-driver-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ingest worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ingest-worker
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: true
          tags: ghcr.io/shoham-b/backseat-driver-ingest-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push caption worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: caption-worker
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: true
          tags: ghcr.io/shoham-b/backseat-driver-caption-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

