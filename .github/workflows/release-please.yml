name: Release Please

# Everything that belongs on a release lives in this one workflow. A release created with the default GITHUB_TOKEN
# does not trigger other workflows (no `on: release`), so the publish jobs run here, gated on release-please's output.
on:
  push:
    branches: [master, main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [cli, api, ingest-worker, caption-worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Version tag only: `latest` moves with every push to main (docker.yml), so a release must be pinned by its tag.
      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: true
          tags: ghcr.io/shoham-b/backseat-driver-${{ matrix.target }}:${{ needs.release-please.outputs.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assets:
    needs: [release-please, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build wheel and sdist
        run: uv build

      - name: Attach distributions to the release
        run: gh release upload "$TAG_NAME" dist/*.whl dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: List the image tags in the release notes
        run: |
          {
            gh release view "$TAG_NAME" --json body --jq .body
            printf '\n### Docker images\n\n'
            for target in cli api ingest-worker caption-worker; do
              echo "- \`ghcr.io/shoham-b/backseat-driver-${target}:${TAG_NAME}\`"
            done
          } > notes.md
          gh release edit "$TAG_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
