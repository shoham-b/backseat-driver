name: CodSpeed

on:
  push:
    branches: [master, main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to generate initial performance data.
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks --codspeed
