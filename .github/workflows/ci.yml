name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - backseat_driver/**
              - tests/**
              - pyproject.toml
              - uv.lock
              - .python-version
            deployment:
              - docker/**
              - deploy/**
              - .python-version

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ty check backseat_driver tests

  test:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest tests/unittests tests/integrationtests --cov --cov-report=xml --junitxml=junit.xml
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-xml
          path: junit.xml

  # The suite above runs from the source tree with every extra installed, so it cannot see a dependency the wheel forgot
  # to declare. This installs the built wheel alone into an empty environment, the way a user gets it.
  package:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install the wheel into an empty environment and start the CLI
        run: |
          uv venv "$RUNNER_TEMP/clean"
          wheel="$(ls "$PWD"/dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" "$wheel"
          "$RUNNER_TEMP/clean/bin/backseat-driver" --version
          "$RUNNER_TEMP/clean/bin/backseat-driver" describe --help
          "$RUNNER_TEMP/clean/bin/backseat-driver" report --help
      - name: Every extra resolves
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          for extra in cli api ingest-worker caption-worker; do
            uv pip install --dry-run --python "$RUNNER_TEMP/clean/bin/python" "${wheel}[${extra}]"
          done

  # CI is otherwise Linux only; the recipes and the developer machines are partly Windows.
  test-windows:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest tests/unittests tests/integrationtests

  test-ui:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      # Chrome and chromedriver come with the ubuntu-latest image; Selenium Manager locates them.
      - run: uv run pytest tests/uitests -v

  test-system:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Python version
        run: echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - run: docker compose -f docker/docker-compose.yml --project-directory . --profile test run --build --rm systemtest
        env:
          # Compose has no default model, and CI has no .env to supply one.
          BACKSEAT_DRIVER_VLM_MODEL_NAME: Salesforce/blip-image-captioning-base
      - if: always()
        run: docker compose -f docker/docker-compose.yml --project-directory . --profile test down

  deploy-config:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: docker compose -f docker/docker-compose.yml --project-directory . --profile cli --profile ui --profile test config --quiet
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml --project-directory . config --quiet
      - run: kubectl kustomize deploy/k8s > rendered.yaml
      - run: uvx kubernetes-validate rendered.yaml
      - run: kubectl kustomize deploy/production > rendered-production.yaml
      - run: uvx kubernetes-validate rendered-production.yaml
      - run: uvx kubernetes-validate deploy/k8s/examples/run-job.yaml

  # Deploys the real images to a kind cluster with KEDA and checks that the stack works and the caption workers
  # autoscale. Gated like test-system: always on push, on branches only when docker/ or deploy/ change.
  kind:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CLUSTER: backseat-driver
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read pinned versions
        run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
          # The Justfile is the single source of truth for the KEDA release `just k8s-up` installs.
          echo "KEDA_VERSION=$(sed -n 's/^keda_version := "\(.*\)"/\1/p' Justfile)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # The three images are built concurrently from one bake file, each with its own cache scope. `load` puts them in
      # the local daemon, from where `kind load` copies them into the cluster.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          files: deploy/kind-ci/docker-bake.hcl
          load: true

      - name: Image hardening
        run: docker/check-image-hardening.sh

      - name: Create ./data (mounted into the kind node)
        run: mkdir -p data

      - uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
          config: deploy/kind/cluster.yaml

      - name: Load images into the cluster
        run: |
          kind load docker-image --name "$CLUSTER" \
            backseat-driver-api:local backseat-driver-ingest-worker:local backseat-driver-caption-worker:local

      - name: Install KEDA
        run: |
          kubectl apply --server-side -f "https://github.com/kedacore/keda/releases/download/v${KEDA_VERSION}/keda-${KEDA_VERSION}.yaml"
          kubectl wait -n keda --for=condition=Available deployment --all --timeout=180s

      # deploy/kind-ci is deploy/kind plus a stub model server and fast autoscaling; the manifests, probes and
      # ScaledObjects are the real ones.
      - name: Deploy
        run: |
          kubectl apply -k deploy/kind-ci
          kubectl -n backseat-driver rollout status deploy/api --timeout=300s
          # There is no ingest-worker to wait for: with KEDA, ingest runs as short Jobs that KEDA starts when a task is queued.
          kubectl -n backseat-driver rollout status deploy/caption-worker deploy/stub-ollama --timeout=180s

      # The dependency cache is off: this job builds images, and zizmor treats a shared cache next to a build as a
      # poisoning risk. The one group installed here is small.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # The systemtest group without dev (which pulls in torch): the tests are black-box HTTP. The project itself is
      # installed, because tests/conftest.py imports backseat_driver.
      - name: System and smoke tests against the cluster
        run: uv run --no-dev --group systemtest pytest tests/systemtests tests/smoketests -v --tb=short --api-url http://localhost:8080

      - name: Autoscaling
        run: deploy/kind-ci/check-scaling.sh

      - name: Cluster state
        if: failure()
        run: |
          kubectl -n backseat-driver get all,scaledobject,hpa,pvc -o wide || true
          kubectl -n backseat-driver describe pods || true
          for app in api ingest-worker caption-worker stub-ollama rabbitmq; do
            echo "::group::logs ${app}"
            kubectl -n backseat-driver logs "deploy/${app}" --tail=100 || true
            echo "::endgroup::"
          done
          echo "::group::keda operator"
          kubectl -n keda logs deploy/keda-operator --tail=100 || true
          echo "::endgroup::"

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uvx pip-audit

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uvx zizmor --config .github/zizmor.yml .github/workflows/

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          ACTIONLINT_VERSION=1.7.4
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
