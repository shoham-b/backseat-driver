services:
  cli:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    environment:
      VLM_SCENE_DESCRIPTION_LOG_FORMAT: json
    profiles: [cli]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      VLM_SCENE_DESCRIPTION_LOG_FORMAT: json


    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  systemtest:
    build:
      context: .
      dockerfile: docker/Dockerfile.systemtest
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles: [test]
