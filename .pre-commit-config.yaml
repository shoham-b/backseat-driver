ci:
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autoupdate_schedule: weekly

# ty runs in both pre-commit (fast, catches regressions early) and CI (blocks merges).
repos:
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 0.0.50
    hooks:
      - id: ty-check

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.0
    hooks:
      - id: typos

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: taplo
        name: taplo (TOML format check)
        language: system
        entry: uvx taplo fmt --check
        types: [toml]
        pass_filenames: true
