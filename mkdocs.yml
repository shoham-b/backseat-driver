site_name: "Backseat Driver"
site_description: "Generates short natural-language scene descriptions for nuScenes driving scenes using a vision-language model"
site_author: "Shoham Baris"
repo_url: "https://github.com/shoham-b/backseat-driver"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Running It: running.md
  - Architecture: architecture.md
  - Distributed Mode: distributed.md
  - Design Decisions: design-decisions.md
  - Development: development.md
  - CLI Reference: cli.md
  - API Reference: api.md
