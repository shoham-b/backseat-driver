# One-off batch run of the pipeline: `backseat-driver describe --mode distributed` submits a job to the API, waits for
# the workers and writes the same JSON file as a local run. It mounts no volume: the dataset is read by the workers from
# the bucket, and the ui Deployment shows the job from the API. The JSON copy goes to a scratch directory, so read it with
# `kubectl logs` or copy it out before the pod is deleted. The model and camera are the workers' own settings.
# Apply after the base: kubectl apply -f deploy/k8s/examples/run-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: run-distributed
  namespace: backseat-driver
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: run
          image: ghcr.io/shoham-b/backseat-driver-cli:latest
          imagePullPolicy: IfNotPresent
          args: [describe, --mode, distributed, --api-url, "http://api", --output, /app/output/cluster.json]
          envFrom:
            - configMapRef: {name: backseat-driver-config}
          volumeMounts:
            - {name: output, mountPath: /app/output}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: output, emptyDir: {}}
