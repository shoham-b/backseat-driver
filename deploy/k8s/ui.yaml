# Model-comparison report (`fastapi run backseat_driver/reporting/ui_server.py`), built on every page load from the completed jobs on the API; images are
# proxied from it too. It mounts nothing: it needs the API's address only, so it runs on any node and a job that finishes
# shows up on the next refresh. The live-inference card is called by the browser, so BACKSEAT_DRIVER_UI_PUBLIC_API_URL is the address
# the browser reaches the API at (here the usual `kubectl port-forward svc/api 8080:80`); set it for an ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: ui}
  template:
    metadata:
      labels: {app: ui}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ui
          image: ghcr.io/shoham-b/backseat-driver-cli
          imagePullPolicy: IfNotPresent
          command: [fastapi, run, backseat_driver/reporting/ui_server.py, --host, 0.0.0.0, --port, "8081"]
          ports: [{containerPort: 8081, name: http}]
          envFrom:
            - configMapRef: {name: backseat-driver-config}
          env:
            - {name: BACKSEAT_DRIVER_UI_ALL_JOBS, value: "true"}
            - {name: BACKSEAT_DRIVER_API_URL, value: "http://api"}
            - {name: BACKSEAT_DRIVER_UI_PUBLIC_API_URL, value: "http://localhost:8080"}
          # /healthz does not call the API, so a probe never depends on it (the page itself does).
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  selector: {app: ui}
  ports: [{port: 80, targetPort: http, name: http}]
