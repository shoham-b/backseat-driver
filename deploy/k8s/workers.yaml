# Each worker has its own image (no torch in ingest, no nuscenes-devkit in caption). Neither mounts the dataset: the
# dataset-upload Job puts it in the dataset bucket (object-store.yaml in development), ingest reads only its metadata
# tables from there and the caption workers fetch single images, so both can run on any node.
# Scale caption-worker with `kubectl scale` or let KEDA do it (deploy/components/keda-autoscaling); replicas share one queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: ingest-worker}
  template:
    metadata:
      labels: {app: ingest-worker}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/shoham-b/backseat-driver-ingest-worker
          imagePullPolicy: IfNotPresent
          args: [worker, ingest]
          envFrom:
            - configMapRef: {name: backseat-driver-config}
            - secretRef: {name: backseat-driver-secrets}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caption-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: caption-worker}
  template:
    metadata:
      labels: {app: caption-worker}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/shoham-b/backseat-driver-caption-worker
          imagePullPolicy: IfNotPresent
          args: [worker, caption]
          envFrom:
            - configMapRef: {name: backseat-driver-config}
            - secretRef: {name: backseat-driver-secrets}
          volumeMounts:
            - {name: hf-cache, mountPath: /home/app/.cache/huggingface}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 4Gi}
      volumes:
        - {name: hf-cache, emptyDir: {}}
