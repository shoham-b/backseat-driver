# Workers scale on queue depth, which measures pending work directly: the caption worker handles one
# message at a time (solo pool), so CPU says little about how far behind it is. `messages` counts
# ready + unacked, so in-flight captions still hold their replica.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-management
spec:
  secretTargetRef:
    - {parameter: host, name: rabbitmq-management, key: host}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: caption-worker
spec:
  scaleTargetRef:
    name: caption-worker
  minReplicaCount: 1 # a replica loads the model on start; scaling to zero would add that delay to the first job
  maxReplicaCount: 8
  # A new replica must load the model before it helps, so a low per-replica target or fast ramp-up adds
  # cold starts for queues that would have drained anyway.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          policies: [{type: Pods, value: 2, periodSeconds: 60}]
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: backseat_driver.caption
        mode: QueueLength
        value: "20" # one replica per 20 waiting scenes
      authenticationRef: {name: rabbitmq-management}
---
# Ingest is a short run-to-completion task (read the metadata tables, publish one message per scene), so each queued
# ingest task gets its own Job that exits when done and nothing runs while the queue is empty. The component deletes the
# base ingest-worker Deployment in its favour. The task is acked only after it succeeded, so a Job that dies mid-way
# leaves the message to be redelivered to the next one.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ingest-worker
spec:
  pollingInterval: 5
  maxReplicaCount: 3
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTargetRef:
    backoffLimit: 3
    template:
      metadata:
        labels: {app: ingest-worker}
      spec:
        restartPolicy: Never
        securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
        containers:
          - name: worker
            image: ghcr.io/shoham-b/backseat-driver-ingest-worker
            imagePullPolicy: IfNotPresent
            args: [worker, ingest, --once]
            envFrom:
              - configMapRef: {name: backseat-driver-config}
              - secretRef: {name: backseat-driver-secrets}
            securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            resources:
              requests: {cpu: 100m, memory: 512Mi}
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: backseat_driver.ingest
        mode: QueueLength
        value: "1" # one Job per waiting task
      authenticationRef: {name: rabbitmq-management}
