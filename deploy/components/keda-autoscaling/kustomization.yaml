# Queue-depth autoscaling for the workers. Optional, and kept out of the base because it needs KEDA
# (https://keda.sh) installed in the cluster. Use it from an overlay: `components: [../components/keda-autoscaling]`.
# The overlay must also provide the `rabbitmq-management` Secret (key `host`, the management API URL with credentials).
# KEDA reads queue depth from RabbitMQ's management HTTP API, which the plain `rabbitmq` image of the base doesn't run.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - autoscaling.yaml
patches:
  # The ingest ScaledJob replaces the always-on ingest worker.
  - target: {kind: Deployment, name: ingest-worker}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingest-worker
  # KEDA owns the replica count; a fixed one here would be reset on every `kubectl apply`.
  - target: {kind: Deployment, name: caption-worker}
    patch: |-
      - {op: remove, path: /spec/replicas}
  - target: {kind: Deployment, name: rabbitmq}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/image, value: "rabbitmq:4-management"}
      - {op: add, path: /spec/template/spec/containers/0/ports/-, value: {containerPort: 15672, name: management}}
  - target: {kind: Service, name: rabbitmq}
    patch: |-
      - {op: add, path: /spec/ports/-, value: {port: 15672, name: management}}
