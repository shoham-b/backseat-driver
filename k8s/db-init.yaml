# One-shot, like the compose `db-init` service. `db init` is idempotent, so re-applying is safe; delete the
# finished Job first (`kubectl delete job db-init -n backseat-driver`) because a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 20 # postgres may still be starting; each retry backs off
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: ghcr.io/shoham-b/backseat-driver-cli:latest
          args: [db, init]
          envFrom:
            - configMapRef: {name: backseat-driver}
            - secretRef: {name: backseat-driver}
