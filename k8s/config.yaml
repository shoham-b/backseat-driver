# Mirrors the BACKSEAT_DRIVER_* variables compose sets. Everything here is non-secret; credentials are in the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backseat-driver
data:
  BACKSEAT_DRIVER_LOG_FORMAT: json
  BACKSEAT_DRIVER_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  BACKSEAT_DRIVER_VLM_BACKEND: huggingface
  BACKSEAT_DRIVER_VLM_MODEL_NAME: Salesforce/blip-image-captioning-base
  BACKSEAT_DRIVER_OLLAMA_MODEL_NAME: llava
  BACKSEAT_DRIVER_OLLAMA_URL: http://ollama:11434
  BACKSEAT_DRIVER_ANTHROPIC_MODEL_NAME: claude-haiku-4-5-20251001
  BACKSEAT_DRIVER_NUSCENES_VERSION: v1.0-mini
  BACKSEAT_DRIVER_CAMERA_CHANNEL: CAM_FRONT
---
# Demo credentials matching docker-compose.yml. Replace before using anywhere shared, and set
# BACKSEAT_DRIVER_ANTHROPIC_API_KEY here (or via your secret manager) if VLM_BACKEND=anthropic.
apiVersion: v1
kind: Secret
metadata:
  name: backseat-driver
type: Opaque
stringData:
  BACKSEAT_DRIVER_DATABASE_URL: postgresql+psycopg://backseat_driver:backseat_driver@postgres:5432/backseat_driver
  POSTGRES_PASSWORD: backseat_driver
