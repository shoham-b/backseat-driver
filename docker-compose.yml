x-distributed-env: &distributed-env
  BACKSEAT_DRIVER_LOG_FORMAT: json
  BACKSEAT_DRIVER_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  BACKSEAT_DRIVER_DATABASE_URL: postgresql+psycopg://backseat_driver:backseat_driver@postgres:5432/backseat_driver

# Captioner settings, interpolated from the shell or .env so the container paths use the same backend as `just run`.
# The .env file itself is not passed through: its localhost URLs are wrong inside a container.
x-vlm-env: &vlm-env
  BACKSEAT_DRIVER_VLM_BACKEND: ${BACKSEAT_DRIVER_VLM_BACKEND:-huggingface}
  BACKSEAT_DRIVER_VLM_MODEL_NAME: ${BACKSEAT_DRIVER_VLM_MODEL_NAME:-Salesforce/blip-image-captioning-base}
  BACKSEAT_DRIVER_OLLAMA_MODEL_NAME: ${BACKSEAT_DRIVER_OLLAMA_MODEL_NAME:-llava}
  # An Ollama server on the host is not "localhost" from inside a container.
  BACKSEAT_DRIVER_OLLAMA_URL: ${BACKSEAT_DRIVER_COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
  BACKSEAT_DRIVER_ANTHROPIC_MODEL_NAME: ${BACKSEAT_DRIVER_ANTHROPIC_MODEL_NAME:-claude-haiku-4-5-20251001}
  BACKSEAT_DRIVER_ANTHROPIC_API_KEY: ${BACKSEAT_DRIVER_ANTHROPIC_API_KEY:-}
  BACKSEAT_DRIVER_NUSCENES_VERSION: ${BACKSEAT_DRIVER_NUSCENES_VERSION:-v1.0-mini}
  BACKSEAT_DRIVER_CAMERA_CHANNEL: ${BACKSEAT_DRIVER_CAMERA_CHANNEL:-CAM_FRONT}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: cli
  volumes:
    - ./data:/app/data:ro
    - hf-cache:/home/app/.cache/huggingface
  extra_hosts: *host-gateway
  environment:
    <<: [*distributed-env, *vlm-env]
  depends_on:
    rabbitmq:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  cli:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    # The image runs as uid 10001, which can't write to a bind-mounted ./output that docker created as root.
    # Set LOCAL_UID/LOCAL_GID (e.g. `LOCAL_UID=$(id -u) LOCAL_GID=$(id -g)`) to own the results as yourself.
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
      - hf-cache:/home/app/.cache/huggingface
    extra_hosts: *host-gateway
    environment:
      <<: *vlm-env
      BACKSEAT_DRIVER_LOG_FORMAT: json
    profiles: [cli]

  # Model-comparison report over the result files in ./output: http://localhost:8081
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    command: ["ui", "--no-open"]
    environment:
      BACKSEAT_DRIVER_UI_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output:ro
    ports:
      - "8081:8081"
    profiles: [ui]

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672" # AMQP, for the API / workers running on the host (`just dev`, `just worker-*`)
      - "127.0.0.1:15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: backseat_driver
      POSTGRES_PASSWORD: backseat_driver
      POSTGRES_DB: backseat_driver
    ports:
      - "127.0.0.1:5432:5432" # for the API / workers running on the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "backseat_driver"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: creates the tables, then exits. Everything that touches the database waits for it.
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    command: ["db", "init"]
    environment:
      <<: *distributed-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8080:8080"
    extra_hosts: *host-gateway
    environment:
      <<: [*distributed-env, *vlm-env]
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingest-worker:
    <<: *worker
    command: ["worker", "ingest"]

  # Scale out with `docker compose up --scale caption-worker=N`; each replica pulls from the same queue.
  caption-worker:
    <<: *worker
    command: ["worker", "caption"]
    deploy:
      replicas: 2

  systemtest:
    build:
      context: .
      dockerfile: docker/Dockerfile.systemtest
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles: [test]

volumes:
  pgdata:
  hf-cache:
