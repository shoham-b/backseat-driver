[project]
name = "backseat-driver"
version = "0.2.3"
description = "Generates short natural-language scene descriptions for nuScenes driving scenes using a vision-language model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Shoham Baris", email = "shoham.baris@gmail.com" }]
# What every entry point imports; the heavy runtimes are extras (`pip install "backseat-driver[cli]"`).
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "loguru>=0.7",
    "pydantic-settings>=2.9",
    # Async file reads and writes (anyio.Path); httpx and Starlette already require it.
    "anyio>=4",
    # The Anthropic backend sends a batch of captions concurrently, on any image that can run it.
    "httpx>=0.28",
]

# The runtime sets, one per image and entry point: `pip install "backseat-driver[cli]"`, `uv sync --extra api`.
[project.optional-dependencies]
vlm = [
    "torch>=2.4",
    # The HuggingFace backend uses the unconditional "image-to-text" pipeline task. An earlier note said
    # transformers 5 folded it into the prompt-requiring "image-text-to-text" task; the range now allows 5.x
    # (dependabot raised it) and uv.lock resolves 4.x, so check the task still exists before locking a 5.x.
    "transformers>=4.44,<6",
    "pillow>=10.4",
]
# Broker + database clients shared by the API and the queue workers.
jobs = [
    "celery>=5.6.3",
    "kombu>=5.6.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]
# S3-compatible client for the images that travel from the ingest worker to the caption workers.
object-storage = ["boto3>=1.35"]
# Stemming for the report metrics.
report = ["snowballstemmer>=2.2"]
# Per-service images: the ingest worker only reads the dataset, the caption worker only runs the model.
ingest-worker = ["backseat-driver[jobs,object-storage]"]
caption-worker = ["backseat-driver[vlm,jobs,object-storage]"]
# Everything the batch CLI pipeline needs at runtime. The report UI is a FastAPI app run with `fastapi run`.
cli = [
    "fastapi[standard]>=0.115",
    "backseat-driver[report,vlm,jobs,object-storage]",
]
# Everything the HTTP API needs at runtime (the API never opens the dataset, it only serves single images from it,
# hence the object-storage client).
api = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.12",
    "backseat-driver[vlm,jobs,object-storage]",
]

[project.scripts]
backseat-driver = "backseat_driver.cli.__main__:app"
bd = "backseat_driver.cli.__main__:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backseat_driver*"]

[tool.setuptools.package-data]
"backseat_driver.show" = ["report_template.html"]

[dependency-groups]
systemtest = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "hypothesis>=6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "coverage[toml]>=7",
    "httpx>=0.28",
    "hypothesis>=6",
    "schemathesis>=3.0",
    "pytest-codspeed>=5.0.3",
    "selenium>=4.25",
    "backseat-driver[cli,api]",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped async fixtures (e.g. the system-test httpx client) must share the tests' event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["backseat_driver"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

