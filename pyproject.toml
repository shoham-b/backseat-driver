[project]
name = "backseat-driver"
version = "0.2.5"
description = "Generates short natural-language scene descriptions for nuScenes driving scenes using a vision-language model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Shoham Baris", email = "shoham.baris@gmail.com" }]
# What every entry point imports; the heavy runtimes are extras (`pip install "backseat-driver[cli]"`).
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    # The Anthropic backend sends a batch of captions concurrently, on any image that can run it.
    "httpx>=0.28.1",
]

# The runtime sets, one per image and entry point: `pip install "backseat-driver[cli]"`, `uv sync --extra api`.
[project.optional-dependencies]
vlm = [
    "torch>=2.14.1",
    # The HuggingFace backend uses the unconditional "image-to-text" pipeline task, which transformers 5 removed
    # (it folded into the prompt-requiring "image-text-to-text" task), so stay on 4.x until the backend moves.
    "transformers>=5.18.0,<6",
    "pillow>=12.3.0",
]
# Broker + database clients shared by the API and the queue workers.
jobs = [
    "celery>=5.6.3",
    "kombu>=5.6.2",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.3",
    # The monolith's SQLite job store; Postgres uses psycopg's own async mode.
    "aiosqlite>=0.22.1",
]
# S3-compatible client for the images that travel from the ingest worker to the caption workers.
object-storage = ["aioboto3>=15.5.0"]
# Stemming for the report metrics.
report = ["snowballstemmer>=3.1.1"]
# Per-service images: the ingest worker only reads the dataset, the caption worker only runs the model.
ingest-worker = ["backseat-driver[jobs,object-storage]"]
caption-worker = ["backseat-driver[vlm,jobs,object-storage]"]
# Everything the batch CLI pipeline needs at runtime. The report UI is a FastAPI app run with `fastapi run`.
cli = [
    "fastapi[standard]>=0.142.2",
    "backseat-driver[report,vlm,jobs,object-storage]",
]
# Everything the HTTP API needs at runtime (the API never opens the dataset, it only serves single images from it,
# hence the object-storage client).
api = [
    "fastapi[standard]>=0.142.2",
    "python-multipart>=0.0.32",
    "backseat-driver[vlm,jobs,object-storage]",
]

[project.scripts]
backseat-driver = "backseat_driver.cli.__main__:app"
bd = "backseat_driver.cli.__main__:app"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backseat_driver*"]

[tool.setuptools.package-data]
"backseat_driver.show" = ["report_template.html"]

[dependency-groups]
systemtest = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage[toml]>=7.16.2",
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "schemathesis>=4.29.1",
    "pytest-codspeed>=5.0.3",
    "selenium>=4.50.0",
    "backseat-driver[cli,api]",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped async fixtures (e.g. the system-test httpx client) must share the tests' event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["backseat_driver"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

